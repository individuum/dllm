# /etc/nginx/sites-available/dllm — install symlink in sites-enabled then `nginx -t && systemctl reload nginx`
# certbot will inject ssl_certificate lines on `certbot --nginx -d dllm.planetbass.de`.

server {
    listen 80;
    listen [::]:80;
    server_name dllm.planetbass.de;

    location / {
        return 301 https://$host$request_uri;
    }

    # certbot http-01 challenge lives at /.well-known/acme-challenge/
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dllm.planetbass.de;

    # state/delta blobs can be multi-MB now and multi-GB at 70B scale
    client_max_body_size 4G;
    client_body_buffer_size 64K;
    # proxy_request_buffering off: stream /delta uploads through to coord
    # without buffering the whole multi-hundred-MB body in nginx memory.
    proxy_request_buffering off;
    # proxy_buffering ON (default but explicit): let nginx drain the /state
    # response from coord at full LAN speed (loopback ≫ Gbit), then ship to
    # client at network speed. Without this, the coord's send is gated by
    # the client's slow download and single-stream throughput stays at
    # ~7 Mbit/s even on a 600 Mbit downlink. Bump buffer sizes so the 624 MB
    # /state response either fits in memory (64 × 1m = 64 MB) or spills to
    # disk (proxy_max_temp_file_size 1g). Big buffer = big throughput win.
    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 64 1m;
    proxy_busy_buffers_size 16m;
    proxy_max_temp_file_size 1024m;
    proxy_temp_file_write_size 8m;

    # state pulls and delta pushes can take a while on slow links
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # HTTP keep-alive between nginx and the coord container
    keepalive_timeout 75s;

    # Static binary distributions of the contributor desktop client
    # (PyInstaller bundle, ~2-5 GB). Hosting here instead of GitHub
    # Releases sidesteps the 2 GB per-asset cap and lets us push
    # updates without cutting a release tag. Directory listing on so
    # /downloads/ shows past versions; cache-busting via filename
    # versioning so a long Cache-Control is safe.
    location /downloads/ {
        alias /opt/dllm/downloads/;
        autoindex on;
        autoindex_exact_size off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
