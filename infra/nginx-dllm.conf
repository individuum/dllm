# /etc/nginx/sites-available/dllm — install symlink in sites-enabled then `nginx -t && systemctl reload nginx`
# certbot will inject ssl_certificate lines on `certbot --nginx -d dllm.planetbass.de`.

server {
    listen 80;
    listen [::]:80;
    server_name dllm.planetbass.de;

    location / {
        return 301 https://$host$request_uri;
    }

    # certbot http-01 challenge lives at /.well-known/acme-challenge/
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dllm.planetbass.de;

    # state/delta blobs can be multi-MB now and multi-GB at 70B scale
    client_max_body_size 4G;
    client_body_buffer_size 64K;
    proxy_request_buffering off;
    proxy_buffering off;

    # state pulls and delta pushes can take a while on slow links
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # HTTP keep-alive between nginx and the coord container
    keepalive_timeout 75s;

    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
