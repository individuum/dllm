[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dllm"
version = "0.0.1"
description = "Volunteer-trained EU-jurisdiction open language model — Phase 0 prototype"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.8",
    "tqdm>=4.66",
    "rich>=13.7",
    "requests>=2.32",
    "packaging>=23.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]
# `[data]` extras are only needed to PREPARE the corpus (HuggingFace streaming
# downloads + BPE training). Coord and worker images don't need these at
# runtime — they consume pre-tokenized .bin files + tokenizer.json.
data = [
    "datasets>=2.20",
    "tokenizers>=0.20",
]

[project.scripts]
dllm-coord = "dllm.coord.server:main"
dllm-worker = "dllm.client.worker:main"
dllm-prepare = "dllm.data.prepare:main"
dllm-smoke = "dllm.scripts.smoke_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dllm.coord" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]
